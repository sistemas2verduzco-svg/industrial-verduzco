<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maximos y Minimos CONTPAQi</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        .mm-wrap { max-width: 1450px; margin: 22px auto; padding: 0 16px 24px; }
        .toolbar {
            display: grid;
            grid-template-columns: 1.2fr 1fr 1fr 1fr 0.9fr 0.8fr 0.8fr 0.8fr 1fr 1fr auto auto auto;
            gap: 10px;
            align-items: center;
            margin-bottom: 12px;
        }
        .toolbar input, .toolbar select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d5dee8;
            border-radius: 8px;
            background: #fff;
            font-size: 14px;
        }
        .btn {
            border: 1px solid transparent;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            color: #fff;
            background: #1565c0;
        }
        .btn-secondary { background: #546e7a; border-color: #455a64; }
        .btn-success { background: #2e7d32; border-color: #1b5e20; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .summary {
            background: linear-gradient(135deg, #ecf6ff 0%, #f7ffef 100%);
            border: 1px solid #d3e8f7;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
            display: grid;
            grid-template-columns: repeat(5, minmax(120px, 1fr));
            gap: 10px;
            font-size: 12px;
            color: #263238;
        }
        .summary b { display: block; color: #0b4b77; font-size: 11px; margin-bottom: 2px; }
        .status { font-size: 12px; color: #546e7a; margin-bottom: 10px; }
        .pager {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 8px 0 12px;
            flex-wrap: wrap;
        }
        .table-wrap {
            border: 1px solid #dce3e8;
            border-radius: 10px;
            overflow: auto;
            background: #fff;
        }
        table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 1300px; }
        th, td { border-bottom: 1px solid #eef2f6; padding: 8px; text-align: left; white-space: nowrap; }
        thead th { position: sticky; top: 0; background: #f7fafc; color: #455a64; z-index: 1; }
        .tag { display: inline-block; padding: 2px 7px; border-radius: 999px; font-size: 11px; font-weight: 700; }
        .tag.ok { background: #e8f5e9; color: #1b5e20; }
        .tag.low { background: #ffebee; color: #b71c1c; }
        .tag.high { background: #fff8e1; color: #8d6e00; }
        .muted { color: #78909c; font-size: 12px; }

        @media (max-width: 1100px) {
            .toolbar { grid-template-columns: 1fr; }
            .summary { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
    <div class="mm-wrap">
        <h2>Maximos y Minimos CONTPAQi</h2>
        <p class="muted">Existencia actual desde CONTPAQ y cantidades pedidas segun el periodo exacto filtrado.</p>

        <div class="toolbar">
            <input id="q" type="text" placeholder="Buscar clave, descripcion o sucursal">
            <input id="sucursal" type="text" placeholder="Sucursal">
            <input id="category1" type="text" placeholder="Categoria 1">
            <input id="category2" type="text" placeholder="Categoria 2">
            <select id="period_type">
                <option value="week" selected>Semana</option>
                <option value="month">Mes</option>
                <option value="date">Fechas</option>
            </select>
            <input id="period_from" type="number" min="1" max="53" placeholder="Desde">
            <input id="period_to" type="number" min="1" max="53" placeholder="Hasta">
            <input id="period_year" type="number" min="2020" max="2100" placeholder="Año">
            <input id="date_from" type="date" placeholder="Fecha desde">
            <input id="date_to" type="date" placeholder="Fecha hasta">
            <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:#455a64;"><input id="only_alert" type="checkbox"> Solo alertas</label>
            <button id="btnBuscar" class="btn">Aplicar</button>
            <button id="btnLimpiar" class="btn btn-secondary">Limpiar</button>
            <button id="btnExport" class="btn btn-success">Exportar CSV</button>
        </div>

        <div id="summary" class="summary" style="display:none;"></div>
        <div id="status" class="status">Cargando...</div>

        <div class="pager">
            <label for="limit" style="font-size:12px;color:#455a64;">Registros por pagina</label>
            <select id="limit" style="padding:6px 8px;border:1px solid #cfd8dc;border-radius:6px;">
                <option value="100">100</option>
                <option value="200" selected>200</option>
                <option value="500">500</option>
                <option value="1000">1000</option>
            </select>
            <button class="btn btn-secondary" id="btnPrev">Anterior</button>
            <button class="btn btn-secondary" id="btnNext">Siguiente</button>
            <span id="pageInfo" class="status" style="margin:0;"></span>
        </div>

        <div class="table-wrap">
            <table>
                <thead id="thead"></thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
    </div>

    <script>
        let state = { page: 1, hasPrev: false, hasNext: false };

        function fmtNum(value) {
            const n = Number(value || 0);
            return n.toLocaleString('es-MX', { maximumFractionDigits: 2 });
        }

        function statusTag(status) {
            if (status === 'BAJO_MINIMO') return '<span class="tag low">BAJO</span>';
            if (status === 'SOBRE_MAXIMO') return '<span class="tag high">ALTO</span>';
            return '<span class="tag ok">OK</span>';
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#39;');
        }

        function buildQuery(page) {
            const params = new URLSearchParams();
            params.set('page', String(page));
            params.set('limit', document.getElementById('limit').value || '200');
            const q = document.getElementById('q').value.trim();
            const suc = document.getElementById('sucursal').value.trim();
            const c1 = document.getElementById('category1').value.trim();
            const c2 = document.getElementById('category2').value.trim();
            const periodType = document.getElementById('period_type').value;
            const periodFrom = document.getElementById('period_from').value.trim();
            const periodTo = document.getElementById('period_to').value.trim();
            const periodYear = document.getElementById('period_year').value.trim();
            const dateFrom = document.getElementById('date_from').value.trim();
            const dateTo = document.getElementById('date_to').value.trim();
            const onlyAlert = document.getElementById('only_alert').checked;
            if (q) params.set('q', q);
            if (suc) params.set('sucursal', suc);
            if (c1) params.set('category1', c1);
            if (c2) params.set('category2', c2);
            params.set('period_type', periodType || 'week');
            if (periodFrom) params.set('period_from', periodFrom);
            if (periodTo) params.set('period_to', periodTo);
            if (periodYear) params.set('period_year', periodYear);
            if (dateFrom) params.set('date_from', dateFrom);
            if (dateTo) params.set('date_to', dateTo);
            if (onlyAlert) params.set('only_alert', '1');
            return params;
        }

        function syncPeriodInputs() {
            const type = document.getElementById('period_type').value;
            const periodFrom = document.getElementById('period_from');
            const periodTo = document.getElementById('period_to');
            const periodYear = document.getElementById('period_year');
            const dateFrom = document.getElementById('date_from');
            const dateTo = document.getElementById('date_to');
            if (type === 'month') {
                periodFrom.min = '1';
                periodFrom.max = '12';
                periodFrom.placeholder = 'Mes desde';
                periodTo.min = '1';
                periodTo.max = '12';
                periodTo.placeholder = 'Mes hasta';
                periodFrom.disabled = false;
                periodTo.disabled = false;
                periodYear.disabled = false;
                dateFrom.disabled = true;
                dateTo.disabled = true;
            } else {
                if (type === 'week') {
                    periodFrom.min = '1';
                    periodFrom.max = '53';
                    periodFrom.placeholder = 'Semana desde';
                    periodTo.min = '1';
                    periodTo.max = '53';
                    periodTo.placeholder = 'Semana hasta';
                    periodFrom.disabled = false;
                    periodTo.disabled = false;
                    periodYear.disabled = false;
                    dateFrom.disabled = true;
                    dateTo.disabled = true;
                } else {
                    periodFrom.disabled = true;
                    periodTo.disabled = true;
                    periodYear.disabled = true;
                    dateFrom.disabled = false;
                    dateTo.disabled = false;
                }
            }
        }

        async function loadData(page = 1) {
            const status = document.getElementById('status');
            status.textContent = 'Consultando datos...';
            try {
                const params = buildQuery(page);
                const resp = await fetch(`/api/contpaq/maximos-minimos?${params.toString()}`, { credentials: 'same-origin' });
                const data = await resp.json();
                if (!resp.ok) throw new Error(data.error || 'No se pudo consultar maximos y minimos');

                state.page = data.page || page;
                state.hasPrev = !!data.has_prev;
                state.hasNext = !!data.has_next;
                const summary = data.summary || {};
                const periodLabel = summary.period_label || (document.getElementById('period_type').value === 'month' ? 'Mes' : 'Semana');
                const periodColumns = summary.period_columns || [];

                document.getElementById('thead').innerHTML = `
                    <tr>
                        <th>Status</th>
                        <th>Clave</th>
                        <th>Descripcion</th>
                        ${periodColumns.map((label) => `<th>${escapeHtml(label)}</th>`).join('')}
                        <th>Total periodo</th>
                        <th>Pedidos</th>
                        <th>Promedio</th>
                        <th>Existencia</th>
                        <th>Max</th>
                        <th>Min</th>
                        <th>Sugerido compra</th>
                        <th>Disponible</th>
                        <th>Pendiente entregar</th>
                        <th>Pendiente recibir</th>
                        <th>Detalle periodos</th>
                        <th>Categoria 1</th>
                        <th>Categoria 2</th>
                        <th>Ultima sync</th>
                    </tr>
                `;

                const tbody = document.getElementById('tbody');
                tbody.innerHTML = (data.items || []).map((row) => `
                    <tr>
                        <td>${statusTag(row.status)}</td>
                        <td>${row.product_key || ''}</td>
                        <td>${row.product_name || ''}</td>
                        ${periodColumns.map((label) => `<td>${fmtNum((row.period_values || {})[label])}</td>`).join('')}
                        <td>${fmtNum(row.cantidad_periodo)}</td>
                        <td>${fmtNum(row.pedidos_periodo)}</td>
                        <td>${fmtNum(row.promedio)}</td>
                        <td>${fmtNum(row.existencia)}</td>
                        <td>${fmtNum(row.maximo)}</td>
                        <td>${fmtNum(row.minimo)}</td>
                        <td>${fmtNum(row.sugerido_compra)}</td>
                        <td>${fmtNum(row.qty_available)}</td>
                        <td>${fmtNum(row.qty_to_deliver_customer)}</td>
                        <td>${fmtNum(row.qty_to_receive_supplier)}</td>
                        <td title="${escapeHtml(row.detalle_periodos || '')}">${row.detalle_periodos || ''}</td>
                        <td>${row.category1 || ''}</td>
                        <td>${row.category2 || ''}</td>
                        <td>${row.updated_at ? new Date(row.updated_at).toLocaleString('es-MX') : ''}</td>
                    </tr>
                `).join('');

                const summaryEl = document.getElementById('summary');
                summaryEl.style.display = 'grid';
                summaryEl.innerHTML = `
                    <div><b>Total filas</b>${fmtNum(summary.total_rows)}</div>
                    <div><b>Bajo minimo</b>${fmtNum(summary.bajo_minimo)}</div>
                    <div><b>Sobre maximo</b>${fmtNum(summary.sobre_maximo)}</div>
                    <div><b>${periodLabel} ${summary.period_from || summary.period_value || ''} - ${summary.period_to || summary.period_value || ''}/${summary.period_year || ''}</b>${fmtNum(summary.cantidad_periodo_total)}</div>
                    <div><b>Promedio acumulado</b>${fmtNum(summary.promedio_global)}</div>
                `;

                document.getElementById('pageInfo').textContent = `Pagina ${data.page || 1} de ${data.total_pages || 0} (${fmtNum(data.total_records || 0)} registros)`;
                document.getElementById('btnPrev').disabled = !state.hasPrev;
                document.getElementById('btnNext').disabled = !state.hasNext;
                status.textContent = `Actualizado. ${periodLabel} aplicado con detalle de partidas.`;
            } catch (err) {
                status.textContent = `Error: ${err.message}`;
            }
        }

        function exportCsv() {
            const params = buildQuery(1);
            window.location.href = `/api/contpaq/maximos-minimos/export.csv?${params.toString()}`;
        }

        document.getElementById('btnBuscar').addEventListener('click', () => loadData(1));
        document.getElementById('btnLimpiar').addEventListener('click', () => {
            document.getElementById('q').value = '';
            document.getElementById('sucursal').value = '';
            document.getElementById('category1').value = '';
            document.getElementById('category2').value = '';
            document.getElementById('period_type').value = 'week';
            document.getElementById('only_alert').checked = false;
            document.getElementById('date_from').value = '';
            document.getElementById('date_to').value = '';
            const today = new Date();
            const start = new Date(Date.UTC(today.getFullYear(), today.getMonth(), today.getDate()));
            const dayNum = start.getUTCDay() || 7;
            start.setUTCDate(start.getUTCDate() + 4 - dayNum);
            const yearStart = new Date(Date.UTC(start.getUTCFullYear(), 0, 1));
            const weekNo = Math.ceil((((start - yearStart) / 86400000) + 1) / 7);
            document.getElementById('period_from').value = String(weekNo);
            document.getElementById('period_to').value = String(weekNo);
            document.getElementById('period_year').value = String(today.getFullYear());
            syncPeriodInputs();
            loadData(1);
        });
        document.getElementById('btnPrev').addEventListener('click', () => { if (state.hasPrev) loadData(state.page - 1); });
        document.getElementById('btnNext').addEventListener('click', () => { if (state.hasNext) loadData(state.page + 1); });
        document.getElementById('limit').addEventListener('change', () => loadData(1));
        document.getElementById('btnExport').addEventListener('click', exportCsv);
        document.getElementById('period_type').addEventListener('change', syncPeriodInputs);

        (function initPeriods() {
            const today = new Date();
            const start = new Date(Date.UTC(today.getFullYear(), today.getMonth(), today.getDate()));
            const dayNum = start.getUTCDay() || 7;
            start.setUTCDate(start.getUTCDate() + 4 - dayNum);
            const yearStart = new Date(Date.UTC(start.getUTCFullYear(), 0, 1));
            const weekNo = Math.ceil((((start - yearStart) / 86400000) + 1) / 7);
            document.getElementById('period_from').value = String(weekNo);
            document.getElementById('period_to').value = String(weekNo);
            document.getElementById('period_year').value = String(today.getFullYear());
            syncPeriodInputs();
        })();

        loadData(1);
    </script>
</body>
</html>
