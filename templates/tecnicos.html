<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Técnicos QR — Control Calidad 360</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        .tec-header { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:24px; }
        .tec-header h2 { margin:0; font-size:1.5rem; }
        .tec-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:18px; }
        .tec-card { background:#fff; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,.08); overflow:hidden; display:flex; flex-direction:column; }
        .tec-card-photo { width:100%; height:160px; object-fit:cover; background:#f0f4f8; }
        .tec-card-photo-placeholder { width:100%; height:160px; background:linear-gradient(135deg,#e3eaf6,#cfd8e8); display:flex; align-items:center; justify-content:center; font-size:60px; }
        .tec-card-body { padding:14px 16px; flex:1; }
        .tec-card-name { font-size:1.05rem; font-weight:700; margin-bottom:2px; }
        .tec-card-empresa { font-size:.85rem; color:#555; margin-bottom:4px; }
        .tec-card-num { font-size:.8rem; color:#888; }
        .tec-card-footer { padding:10px 16px 14px; display:flex; gap:8px; flex-wrap:wrap; border-top:1px solid #f0f0f0; }
        .badge { display:inline-block; padding:3px 10px; border-radius:20px; font-size:.75rem; font-weight:600; }
        .badge-activo { background:#d4edda; color:#155724; }
        .badge-suspendido { background:#f8d7da; color:#721c24; }
        .badge-expirado { background:#fff3cd; color:#856404; }
        .btn-sm { padding:5px 12px; border-radius:6px; border:none; cursor:pointer; font-size:.82rem; font-weight:600; transition:opacity .15s; }
        .btn-sm:hover { opacity:.82; }
        .btn-primary { background:#1976d2; color:#fff; }
        .btn-danger  { background:#e53935; color:#fff; }
        .btn-success { background:#388e3c; color:#fff; }
        .btn-warning { background:#f57c00; color:#fff; }
        .btn-secondary { background:#607d8b; color:#fff; }
        /* Modal */
        .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:1000; align-items:center; justify-content:center; }
        .modal-overlay.active { display:flex; }
        .modal-box { background:#fff; border-radius:12px; width:100%; max-width:480px; padding:28px 28px 20px; position:relative; }
        .modal-box h3 { margin:0 0 18px; font-size:1.15rem; }
        .modal-close { position:absolute; top:14px; right:16px; background:none; border:none; font-size:1.4rem; cursor:pointer; color:#555; }
        .form-group { margin-bottom:14px; }
        .form-group label { display:block; font-size:.88rem; font-weight:600; margin-bottom:5px; }
        .form-group input, .form-group select { width:100%; padding:8px 10px; border:1px solid #ccc; border-radius:6px; font-size:.9rem; box-sizing:border-box; }
        .form-group input[type=file] { padding:4px 6px; }
        .form-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:18px; }
        .empty-state { text-align:center; padding:60px 20px; color:#888; }
        .empty-state .icon { font-size:56px; margin-bottom:12px; }
        .search-bar { display:flex; gap:10px; margin-bottom:20px; }
        .search-bar input { flex:1; padding:9px 12px; border:1px solid #ccc; border-radius:8px; font-size:.92rem; }
        .expiry-text { font-size:.78rem; color:#777; margin-top:4px; }
        .expiry-near { color:#c0392b; font-weight:600; }
    </style>
</head>
<body>
{% include '_sidebar.html' %}

<div class="container">
    <div class="tec-header">
        <h2>🪪 Técnicos QR</h2>
        <button class="btn-sm btn-primary" onclick="abrirModalNuevo()">+ Nuevo Técnico</button>
    </div>

    <div class="search-bar">
        <input type="text" id="buscarInput" placeholder="Buscar por nombre, empresa o número..." oninput="filtrarTecnicos()">
    </div>

    <div id="tecGrid" class="tec-grid">
        <div class="empty-state"><div class="icon">⏳</div><p>Cargando...</p></div>
    </div>
</div>

<!-- Modal Crear/Editar -->
<div class="modal-overlay" id="modalTecnico">
    <div class="modal-box">
        <button class="modal-close" onclick="cerrarModal()">×</button>
        <h3 id="modalTitulo">Nuevo Técnico</h3>
        <form id="formTecnico" enctype="multipart/form-data">
            <input type="hidden" id="tecId" value="">
            <div class="form-group">
                <label>Nombre completo *</label>
                <input type="text" id="tecNombre" required placeholder="Ej. Juan Pérez">
            </div>
            <div class="form-group">
                <label>Empresa *</label>
                <input type="text" id="tecEmpresa" required placeholder="Ej. Mantenimientos SA">
            </div>
            <div class="form-group">
                <label>Número de empleado *</label>
                <input type="text" id="tecNumero" required placeholder="Ej. TEC-001">
            </div>
            <div class="form-group">
                <label>Vigencia hasta *</label>
                <input type="date" id="tecExpiracion" required>
            </div>
            <div class="form-group">
                <label>Foto (opcional)</label>
                <input type="file" id="tecFoto" accept="image/*">
            </div>
            <div class="form-actions">
                <button type="button" class="btn-sm btn-secondary" onclick="cerrarModal()">Cancelar</button>
                <button type="submit" class="btn-sm btn-primary" id="btnGuardar">Guardar</button>
            </div>
        </form>
    </div>
</div>

<script>
let todosLosTecnicos = [];

async function cargarTecnicos() {
    try {
        const r = await fetch('/api/tecnicos');
        const data = await r.json();
        todosLosTecnicos = data.tecnicos || [];
        renderTecnicos(todosLosTecnicos);
    } catch(e) {
        document.getElementById('tecGrid').innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><p>Error al cargar técnicos</p></div>';
    }
}

function filtrarTecnicos() {
    const q = document.getElementById('buscarInput').value.toLowerCase();
    const filtrados = todosLosTecnicos.filter(t =>
        (t.nombre||'').toLowerCase().includes(q) ||
        (t.empresa||'').toLowerCase().includes(q) ||
        (t.numero_empleado||'').toLowerCase().includes(q)
    );
    renderTecnicos(filtrados);
}

function renderTecnicos(lista) {
    const grid = document.getElementById('tecGrid');
    if (!lista.length) {
        grid.innerHTML = '<div class="empty-state"><div class="icon">🪪</div><p>No se encontraron técnicos. Crea el primero.</p></div>';
        return;
    }
    const hoy = new Date();
    grid.innerHTML = lista.map(t => {
        const exp = t.fecha_expiracion ? new Date(t.fecha_expiracion) : null;
        const expirado = exp && exp < hoy;
        const proximoExp = exp && !expirado && ((exp - hoy) / (1000*60*60*24)) <= 30;
        let estadoBadge;
        if (expirado) estadoBadge = '<span class="badge badge-expirado">Expirado</span>';
        else if (t.estado === 'activo') estadoBadge = '<span class="badge badge-activo">Activo</span>';
        else estadoBadge = '<span class="badge badge-suspendido">Suspendido</span>';

        const fotoHtml = t.foto
            ? `<img class="tec-card-photo" src="${t.foto}" alt="Foto" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
            : '';
        const placeholderStyle = t.foto ? 'display:none' : '';

        const expText = exp
            ? `<div class="expiry-text ${proximoExp?'expiry-near':''}">Vigente hasta: ${exp.toLocaleDateString('es-MX')}</div>`
            : '';

        const toggleLabel = t.estado === 'activo' ? 'Suspender' : 'Activar';
        const toggleClass = t.estado === 'activo' ? 'btn-warning' : 'btn-success';

        const verifyUrl = `${location.origin}/verificar/${t.token_qr}`;

        return `
        <div class="tec-card">
            ${fotoHtml}
            <div class="tec-card-photo-placeholder" style="${placeholderStyle}">👷</div>
            <div class="tec-card-body">
                <div class="tec-card-name">${esc(t.nombre)}</div>
                <div class="tec-card-empresa">${esc(t.empresa)}</div>
                <div class="tec-card-num"># ${esc(t.numero_empleado)}</div>
                ${expText}
                <div style="margin-top:8px">${estadoBadge}</div>
            </div>
            <div class="tec-card-footer">
                <button class="btn-sm btn-primary" onclick='editarTecnico(${JSON.stringify(t)})'>✏️ Editar</button>
                <button class="btn-sm ${toggleClass}" onclick="toggleEstado(${t.id},'${t.estado}')">${toggleLabel}</button>
                <a class="btn-sm btn-secondary" href="/api/tecnicos/${t.id}/qr" download>⬇️ QR</a>
                <a class="btn-sm" style="background:#2e7d32;color:#fff" href="/tecnicos/${t.id}/credencial" target="_blank">🪪 Credencial</a>
                <button class="btn-sm" style="background:#673ab7;color:#fff" onclick="copiarLink('${verifyUrl}')">🔗 Link</button>
            </div>
        </div>`;
    }).join('');
}

function esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function abrirModalNuevo() {
    document.getElementById('tecId').value = '';
    document.getElementById('tecNombre').value = '';
    document.getElementById('tecEmpresa').value = '';
    document.getElementById('tecNumero').value = '';
    document.getElementById('tecFoto').value = '';
    // Por defecto un año adelante
    const d = new Date(); d.setFullYear(d.getFullYear()+1);
    document.getElementById('tecExpiracion').value = d.toISOString().slice(0,10);
    document.getElementById('modalTitulo').textContent = 'Nuevo Técnico';
    document.getElementById('btnGuardar').textContent = 'Crear';
    document.getElementById('modalTecnico').classList.add('active');
}

function editarTecnico(t) {
    document.getElementById('tecId').value = t.id;
    document.getElementById('tecNombre').value = t.nombre;
    document.getElementById('tecEmpresa').value = t.empresa;
    document.getElementById('tecNumero').value = t.numero_empleado;
    document.getElementById('tecExpiracion').value = (t.fecha_expiracion||'').slice(0,10);
    document.getElementById('tecFoto').value = '';
    document.getElementById('modalTitulo').textContent = 'Editar Técnico';
    document.getElementById('btnGuardar').textContent = 'Guardar cambios';
    document.getElementById('modalTecnico').classList.add('active');
}

function cerrarModal() {
    document.getElementById('modalTecnico').classList.remove('active');
}

document.getElementById('formTecnico').addEventListener('submit', async function(e) {
    e.preventDefault();
    const id = document.getElementById('tecId').value;
    const fd = new FormData();
    fd.append('nombre', document.getElementById('tecNombre').value.trim());
    fd.append('empresa', document.getElementById('tecEmpresa').value.trim());
    fd.append('numero_empleado', document.getElementById('tecNumero').value.trim());
    fd.append('fecha_expiracion', document.getElementById('tecExpiracion').value);
    const fotoFile = document.getElementById('tecFoto').files[0];
    if (fotoFile) fd.append('foto', fotoFile);

    const url = id ? `/api/tecnicos/${id}` : '/api/tecnicos';
    const method = id ? 'PUT' : 'POST';

    document.getElementById('btnGuardar').disabled = true;
    try {
        const r = await fetch(url, { method, body: fd });
        const data = await r.json();
        if (!r.ok) { alert(data.error || 'Error al guardar'); return; }
        cerrarModal();
        cargarTecnicos();
    } catch(err) {
        alert('Error de conexión');
    } finally {
        document.getElementById('btnGuardar').disabled = false;
    }
});

async function toggleEstado(id, estadoActual) {
    const accion = estadoActual === 'activo' ? 'suspender' : 'activar';
    if (!confirm(`¿${accion.charAt(0).toUpperCase()+accion.slice(1)} este técnico?`)) return;
    const r = await fetch(`/api/tecnicos/${id}/estado`, { method:'POST' });
    if (r.ok) cargarTecnicos();
    else alert('Error al cambiar estado');
}

function copiarLink(url) {
    navigator.clipboard.writeText(url).then(() => alert('Link copiado:\n' + url));
}

// Cerrar modal al click fuera
document.getElementById('modalTecnico').addEventListener('click', function(e) {
    if (e.target === this) cerrarModal();
});

cargarTecnicos();
</script>
</body>
</html>
