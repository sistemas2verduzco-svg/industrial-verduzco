<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo (Consulta)</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#1976d2">
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --consulta-bg: #f4f2ee;
            --consulta-card: #ffffff;
            --consulta-text: #1f2328;
            --consulta-muted: #5f6670;
            --consulta-accent: #c4631c;
            --consulta-accent-dark: #8e3f0b;
            --consulta-border: #ddd7ce;
            --consulta-ink: #2a2d31;
        }

        body.consulta-solo {
            font-family: 'Barlow', 'Segoe UI', sans-serif;
            background: radial-gradient(circle at top, #ffffff 0%, #f4f2ee 55%, #efe8dd 100%);
            color: var(--consulta-text);
            font-size: 18px;
        }

        body.consulta-solo > .container { margin-left: 0; }

        .consulta-page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 1.5rem 1.25rem 2.5rem;
        }

        .consulta-hero {
            background: linear-gradient(135deg, #ffffff 0%, #faf6f0 60%, #f1e7d8 100%);
            border: 1px solid var(--consulta-border);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
        }

        .consulta-hero h1 {
            font-size: 1.8rem;
            margin-bottom: 0.4rem;
            color: var(--consulta-text);
        }

        .consulta-hero p {
            color: var(--consulta-muted);
            margin-bottom: 1rem;
        }

        .consulta-search {
            display: grid;
            gap: 0.75rem;
        }

        .consulta-search label {
            font-weight: 600;
        }

        .consulta-search input {
            font-size: 1rem;
            padding: 0.85rem 1rem;
            border-radius: 12px;
            border: 1px solid var(--consulta-border);
            background: #ffffff;
        }

        .consulta-categories {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-top: 1rem;
        }

        .consulta-categories button {
            border: 1px solid var(--consulta-border);
            background: #ffffff;
            color: var(--consulta-ink);
            padding: 0.7rem 1.2rem;
            border-radius: 999px;
            font-size: 1rem;
            cursor: pointer;
        }

        .consulta-categories button.active {
            background: var(--consulta-accent);
            color: #ffffff;
            border-color: var(--consulta-accent);
        }

        .consulta-grid {
            margin-top: 1.5rem;
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.2rem;
        }

        .consulta-card {
            background: var(--consulta-card);
            border: 1px solid var(--consulta-border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.05);
        }

        .consulta-card-media {
            width: 100%;
            height: 220px;
            background: #e7e2da;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--consulta-muted);
            font-weight: 600;
        }

        .consulta-card-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .consulta-card-body {
            padding: 1.2rem;
        }

        .consulta-card h3 {
            font-size: 1.2rem;
            margin-bottom: 0.4rem;
        }

        .consulta-card .consulta-desc {
            color: var(--consulta-muted);
            margin-bottom: 0.8rem;
        }

        .consulta-card .consulta-price {
            font-weight: 700;
            font-size: 1.4rem;
            color: var(--consulta-accent);
        }

        .consulta-card .consulta-meta {
            margin-top: 0.6rem;
            color: var(--consulta-muted);
            font-size: 0.95rem;
        }

        .consulta-sugerencias {
            position: absolute;
            left: 0;
            right: 0;
            top: calc(100% + 0.4rem);
            background: #fff;
            border: 1px solid var(--consulta-border);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.12);
            list-style: none;
            margin: 0;
            padding: 0;
            max-height: 16rem;
            overflow-y: auto;
            z-index: 3;
            display: none;
            border-radius: 12px;
            scrollbar-width: thin;
            scrollbar-color: var(--consulta-accent) #efe8dd;
            -webkit-overflow-scrolling: touch;
        }

        .consulta-sugerencias li {
            padding: 0.9rem 1rem;
            border-bottom: 1px solid #f0ece6;
            cursor: pointer;
            font-size: 1rem;
        }

        .consulta-sugerencias li:last-child {
            border-bottom: none;
        }

        .consulta-sugerencias li.selected,
        .consulta-sugerencias li:hover {
            background: #f9efe2;
        }

        .consulta-sugerencias .small {
            display: block;
            color: var(--consulta-muted);
            font-size: 0.9rem;
            margin-top: 0.2rem;
        }

        .consulta-sugerencias::-webkit-scrollbar {
            width: 10px;
        }

        .consulta-sugerencias::-webkit-scrollbar-track {
            background: #efe8dd;
            border-radius: 999px;
        }

        .consulta-sugerencias::-webkit-scrollbar-thumb {
            background: var(--consulta-accent);
            border-radius: 999px;
        }

        @media (min-width: 768px) {
            .consulta-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 1024px) {
            .consulta-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 640px) {
            .consulta-page {
                padding: 1rem 0.9rem 2rem;
            }

            .consulta-hero {
                padding: 1.2rem;
            }

            .consulta-card-media {
                height: 200px;
            }

            .consulta-card-body {
                padding: 1rem;
            }

            .consulta-card h3 {
                font-size: 1.1rem;
            }

            .consulta-sugerencias {
                max-height: min(50vh, 260px);
            }
        }
    </style>
</head>
<body class="consulta-solo">
    <div class="consulta-page">
        <section class="consulta-hero">
            <h1>Catalogo de Refacciones</h1>
            <p>Refacciones para maquinaria de tortillas. Interfaz sencilla y clara.</p>
            <div class="consulta-search" style="position: relative;">
                <label for="consulta-buscar">Buscar producto</label>
                <input id="consulta-buscar" type="search" placeholder="Ej. motor, quemador..." autocomplete="off" aria-autocomplete="list" aria-controls="consulta-sugerencias" style="padding-right: 2.8rem;">
                <button type="button" id="consulta-clear" aria-label="Limpiar búsqueda" style="position: absolute; right: 0.6rem; top: 50%; transform: translateY(-50%); background: none; border: none; font-size: 1.6rem; color: #555; cursor: pointer; display: none; width: 2rem; height: 2rem; z-index: 10; padding: 0; line-height: 1; font-weight: bold;">&times;</button>
                <ul id="consulta-sugerencias" class="consulta-sugerencias" role="listbox" aria-label="Sugerencias"></ul>
            </div>
            <div class="consulta-categories">
                <button type="button" class="active" data-categoria="">Todos</button>
                <button type="button" data-categoria="Motors">Motors</button>
                <button type="button" data-categoria="Burners">Burners</button>
                <button type="button" data-categoria="Electrical Parts">Electrical Parts</button>
                <button type="button" data-categoria="Mechanical Parts">Mechanical Parts</button>
            </div>
        </section>

        <section id="consulta-productos" class="consulta-grid">
            <div class="loading">Cargando productos...</div>
        </section>
    </div>

    <script>
        async function fetchJson(url) {
            const res = await fetch(url);
            if (!res.ok) throw new Error('Error en la petición: ' + res.status);
            return res.json();
        }

        function formatPrecioCompra(producto) {
            const divisa = producto.divisa_ultima || '';
            const precio = Number(producto.precio_compra_ultimo);
            if (!Number.isFinite(precio)) {
                return 'Compa: N/A';
            }
            return `Compa: $${precio.toFixed(2)} ${divisa}`.trim();
        }

        function formatPrecioVenta(producto) {
            const precio = Number(producto.precio);
            if (!Number.isFinite(precio)) {
                return 'Venta: N/A';
            }
            return `Venta: $${precio.toFixed(2)}`;
        }

        function renderProductos(productos) {
            const container = document.getElementById('consulta-productos');
            if (!productos || productos.length === 0) {
                container.innerHTML = '<div class="empty-state">No hay productos disponibles</div>';
                return;
            }
            container.innerHTML = '';
            productos.forEach(p => {
                const card = document.createElement('div');
                card.className = 'consulta-card';
                const imagenHtml = p.imagen_url
                    ? `<img src="${p.imagen_url}" alt="${p.nombre}">`
                    : '<span>Sin imagen</span>';
                card.innerHTML = `
                    <div class="consulta-card-media">${imagenHtml}</div>
                    <div class="consulta-card-body">
                        <h3>${p.nombre}</h3>
                        <p class="consulta-desc">${p.descripcion || 'Sin descripcion'}</p>
                        <div class="consulta-price">${formatPrecioVenta(p)}</div>
                        <div class="consulta-meta">${formatPrecioCompra(p)}</div>
                        <div class="consulta-meta">${p.categoria || ''}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function cargarProductosConsulta(params) {
            try {
                let url = '/public/productos';
                if (params) url = '/public/productos/buscar?' + new URLSearchParams(params).toString();
                const productos = await fetchJson(url);
                renderProductos(productos);
            } catch (e) {
                console.error(e);
                document.getElementById('consulta-productos').innerHTML = '<div class="error">Error cargando productos</div>';
            }
        }

        document.addEventListener('DOMContentLoaded', function(){
            cargarProductosConsulta();

            const input = document.getElementById('consulta-buscar');
            const clearBtn = document.getElementById('consulta-clear');
            const sugerencias = document.getElementById('consulta-sugerencias');
            const categoryButtons = document.querySelectorAll('[data-categoria]');
            let categoriaActual = '';

            function aplicarFiltros() {
                const q = input.value.trim();
                const params = {};
                if (q) params.q = q;
                if (categoriaActual) params.categoria = categoriaActual;
                cargarProductosConsulta(params);
            }

            categoryButtons.forEach(btn => {
                btn.addEventListener('click', function(){
                    categoryButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    categoriaActual = btn.dataset.categoria || '';
                    aplicarFiltros();
                });
            });

            // Debounce helper
            let debounceTimer = null;
            function debounce(fn, wait){ return function(...args){ clearTimeout(debounceTimer); debounceTimer = setTimeout(()=> fn.apply(this,args), wait); }; }

            async function fetchSugerenciasConsulta(q){
                try{
                    const params = new URLSearchParams();
                    if (q) params.append('q', q);
                    params.append('limit', 8);
                    const res = await fetch('/public/productos/buscar?' + params.toString());
                    return await res.json();
                }catch(e){ console.error('Error fetch sugerencias public:', e); return []; }
            }

            function renderSugerenciasConsulta(items){
                sugerencias.innerHTML = '';
                if (!items || items.length === 0){ sugerencias.style.display = 'none'; return; }
                items.slice(0,8).forEach((p,i)=>{
                    const li = document.createElement('li');
                    li.dataset.index = i;
                    li.innerHTML = `<strong>${escapeHtml(p.nombre)}</strong><span class="small">${escapeHtml(p.categoria||'')}</span>`;
                    li.addEventListener('click', function(){
                        input.value = p.nombre;
                        sugerencias.style.display = 'none';
                        input.blur();
                        aplicarFiltros();
                    });

                    let moved = false;
                    li.addEventListener('touchstart', function(){
                        moved = false;
                    }, {passive: true});
                    li.addEventListener('touchmove', function(){
                        moved = true;
                    }, {passive: true});
                    li.addEventListener('touchend', function(e){
                        if (moved) return;
                        e.preventDefault();
                        input.value = p.nombre;
                        sugerencias.style.display = 'none';
                        input.blur();
                        aplicarFiltros();
                    });
                    sugerencias.appendChild(li);
                });
                sugerencias.style.display = 'block';
            }

            function escapeHtml(text){ if (!text) return ''; return text.replace(/[&<>"']/g, function(m){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"})[m]; }); }

            const handleInput = debounce(async function(){
                const q = input.value.trim();
                clearBtn.style.display = q ? 'block' : 'none';
                if (q){
                    const results = await fetchSugerenciasConsulta(q);
                    renderSugerenciasConsulta(results);
                } else {
                    renderSugerenciasConsulta([]);
                    cargarProductosConsulta();
                }
            }, 300);

            input.addEventListener('input', handleInput);

            // teclado para sugerencias
            let selected = -1;
            input.addEventListener('keydown', function(e){
                const items = sugerencias.querySelectorAll('li');
                if (!items.length) return;
                if (e.key === 'ArrowDown'){ e.preventDefault(); selected = Math.min(selected+1, items.length-1); items.forEach(n=>n.classList.remove('selected')); items[selected].classList.add('selected'); items[selected].scrollIntoView({block:'nearest', behavior:'smooth'}); }
                else if (e.key === 'ArrowUp'){ e.preventDefault(); selected = Math.max(selected-1,0); items.forEach(n=>n.classList.remove('selected')); items[selected].classList.add('selected'); items[selected].scrollIntoView({block:'nearest', behavior:'smooth'}); }
                else if (e.key === 'Enter'){ const sel = sugerencias.querySelector('li.selected'); if (sel){ e.preventDefault(); sel.click(); } }
                else if (e.key === 'Escape'){ sugerencias.style.display = 'none'; }
            });

            document.addEventListener('click', function(e){ if (!e.target.closest || (!e.target.closest('#consulta-sugerencias') && !e.target.closest('#consulta-buscar'))) sugerencias.style.display = 'none'; });

            function limpiarConsultaBuscador(){ input.value = ''; clearBtn.style.display = 'none'; renderSugerenciasConsulta([]); aplicarFiltros(); }
            clearBtn.addEventListener('click', limpiarConsultaBuscador);
            clearBtn.addEventListener('touchstart', function(e){ e.preventDefault(); limpiarConsultaBuscador(); });

            input.addEventListener('keypress', function(e){ if (e.key === 'Enter') aplicarFiltros(); });
        });

        // Alinear la X respecto al input (para corregir desalineados en distintos navegadores)
        function alignConsultaClearButton(){
            const input = document.getElementById('consulta-buscar');
            const btn = document.getElementById('consulta-clear');
            if (!input || !btn) return;
            const parent = input.closest('.form-group');
            if (!parent) return;
            const inputOffsetTop = input.offsetTop;
            const inputMid = inputOffsetTop + Math.round(input.offsetHeight / 2);
            btn.style.top = inputMid + 'px';
            btn.style.transform = 'translateY(-50%)';
        }
        window.addEventListener('resize', function(){ clearTimeout(window._alignConsultaTimer); window._alignConsultaTimer = setTimeout(alignConsultaClearButton,80); });
        document.addEventListener('DOMContentLoaded', alignConsultaClearButton);
    </script>
</body>
</html>
