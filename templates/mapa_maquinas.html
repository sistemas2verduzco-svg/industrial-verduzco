<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mapa de Maquinas</title>
    <style>
        :root {
            --bg-1: #061428;
            --bg-2: #031024;
            --panel: #091d35;
            --panel-2: #0d2746;
            --line: #1e4d78;
            --txt: #d9edff;
            --muted: #8eb5d6;
            --ok: #14c678;
            --warn: #f4b400;
            --idle: #95a4b5;
            --accent: #19b5ff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            color: var(--txt);
            background:
                radial-gradient(1200px 500px at 0% -10%, #103158 0%, transparent 65%),
                radial-gradient(900px 550px at 100% 0%, #0d2a50 0%, transparent 60%),
                linear-gradient(140deg, var(--bg-1), var(--bg-2));
            font-family: "Rajdhani", "Segoe UI", Tahoma, sans-serif;
            min-height: 100vh;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 16px 20px;
            border-bottom: 1px solid rgba(37, 93, 146, 0.5);
            background: linear-gradient(180deg, rgba(7, 27, 51, 0.96), rgba(7, 27, 51, 0.75));
            backdrop-filter: blur(4px);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .logo-pill {
            width: 38px;
            height: 38px;
            border-radius: 8px;
            border: 1px solid #2b6a9a;
            display: grid;
            place-items: center;
            background: linear-gradient(160deg, #09355c, #051f3f);
            color: #8ed5ff;
            font-weight: 700;
        }

        .title-group {
            min-width: 0;
        }

        .title {
            font-size: 22px;
            line-height: 1;
            font-weight: 700;
            letter-spacing: 0.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .subtitle {
            margin-top: 4px;
            color: var(--muted);
            font-size: 13px;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--muted);
            font-size: 12px;
        }

        .btn {
            border: 1px solid #2d6996;
            background: linear-gradient(180deg, #0b3259, #072542);
            color: #cde9ff;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 12px;
            text-decoration: none;
            cursor: pointer;
        }

        .dashboard {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 310px;
            gap: 14px;
            padding: 14px;
        }

        .main-zone {
            display: block;
            min-width: 0;
        }

        .panel {
            background: linear-gradient(180deg, rgba(8, 31, 56, 0.9), rgba(7, 23, 44, 0.9));
            border: 1px solid rgba(40, 102, 157, 0.6);
            border-radius: 12px;
            box-shadow: inset 0 1px 0 rgba(120, 180, 220, 0.12), 0 8px 28px rgba(0, 0, 0, 0.35);
        }

        .panel-title {
            padding: 10px 12px;
            border-bottom: 1px solid rgba(43, 107, 162, 0.45);
            font-size: 13px;
            color: #93cfff;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .primary-grid {
            padding: 12px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 10px;
        }

        .machine-card {
            background: linear-gradient(180deg, rgba(11, 45, 78, 0.85), rgba(8, 31, 58, 0.85));
            border: 1px solid #2a638f;
            border-radius: 10px;
            padding: 8px;
            display: grid;
            gap: 8px;
            min-height: 130px;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }

        .machine-card:hover {
            transform: translateY(-2px);
            border-color: #40b5ff;
        }

        .state-produciendo {
            box-shadow: inset 0 0 0 1px rgba(20, 198, 120, 0.35);
        }

        .state-activa {
            box-shadow: inset 0 0 0 1px rgba(244, 180, 0, 0.35);
        }

        .state-sin_hoja {
            box-shadow: inset 0 0 0 1px rgba(149, 164, 181, 0.25);
        }

        .machine-head {
            display: flex;
            gap: 8px;
            align-items: center;
            min-width: 0;
        }

        .machine-icon {
            width: 34px;
            height: 34px;
            border-radius: 6px;
            border: 1px solid #2f7bb0;
            background: linear-gradient(180deg, #11406b, #0a2d4c);
            position: relative;
            flex: 0 0 auto;
        }

        .machine-icon::before {
            content: "";
            position: absolute;
            left: 7px;
            top: 6px;
            width: 18px;
            height: 12px;
            border: 1px solid #7ac7ff;
            border-radius: 2px;
            background: rgba(117, 191, 243, 0.16);
        }

        .machine-icon::after {
            content: "";
            position: absolute;
            left: 12px;
            bottom: 5px;
            width: 8px;
            height: 4px;
            border-radius: 2px;
            background: #8ad4ff;
            opacity: 0.85;
        }

        .machine-name {
            font-size: 14px;
            font-weight: 700;
            line-height: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .machine-badge {
            margin-top: 4px;
            font-size: 11px;
            border-radius: 999px;
            padding: 2px 7px;
            display: inline-block;
            font-weight: 700;
            letter-spacing: 0.2px;
        }

        .badge-produciendo {
            color: #9ff5cf;
            background: rgba(20, 198, 120, 0.15);
        }

        .badge-activa {
            color: #ffe093;
            background: rgba(244, 180, 0, 0.15);
        }

        .badge-sin_hoja {
            color: #c2cfdd;
            background: rgba(149, 164, 181, 0.16);
        }

        .machine-meta {
            font-size: 11px;
            color: var(--muted);
            display: grid;
            gap: 4px;
        }

        .machine-meta b {
            color: #d5ecff;
            font-weight: 700;
        }

        .machine-link {
            margin-top: auto;
            text-align: right;
            color: #5ec6ff;
            text-decoration: none;
            font-size: 11px;
            font-weight: 700;
        }

        .rail {
            display: grid;
            gap: 10px;
            align-content: start;
        }

        .stat-card {
            padding: 10px;
        }

        .stat-title {
            font-size: 12px;
            color: #8abbe2;
        }

        .stat-value {
            margin-top: 6px;
            font-size: 34px;
            line-height: 1;
            font-weight: 700;
            color: #e4f4ff;
        }

        .split-stats {
            margin-top: 10px;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 6px;
        }

        .split-box {
            border: 1px solid rgba(50, 107, 155, 0.5);
            border-radius: 8px;
            padding: 8px 6px;
            text-align: center;
            background: rgba(6, 24, 44, 0.55);
        }

        .split-box .k {
            display: block;
            color: var(--muted);
            font-size: 10px;
            margin-bottom: 2px;
        }

        .split-box .v {
            font-size: 16px;
            font-weight: 700;
        }

        .progress-wrap {
            margin-top: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ring {
            --pct: 0;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: conic-gradient(var(--accent) calc(var(--pct) * 1%), #123252 0);
            display: grid;
            place-items: center;
        }

        .ring::before {
            content: "";
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #0b213f;
            border: 1px solid #295e8f;
        }

        .progress-text {
            font-size: 12px;
            color: var(--muted);
        }

        .legend {
            display: grid;
            gap: 6px;
            font-size: 12px;
            color: var(--muted);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            display: inline-block;
        }

        .empty {
            padding: 28px 14px;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
        }

        @media (max-width: 1080px) {
            .dashboard {
                grid-template-columns: 1fr;
            }

            .rail {
                grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            }
        }

        @media (max-width: 640px) {
            .title {
                font-size: 18px;
            }

            .subtitle {
                font-size: 12px;
            }

            .topbar {
                flex-wrap: wrap;
            }

            .topbar-right {
                width: 100%;
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-left">
            <div class="logo-pill">M</div>
            <div class="title-group">
                <div class="title">Mapa de Maquinas - Produccion</div>
                <div class="subtitle">Vista operacional de maquinas activas</div>
            </div>
        </div>
        <div class="topbar-right">
            <a class="btn" href="/hojas_ruta">Volver a Estaciones</a>
            <span id="refreshInfo">Actualizando...</span>
        </div>
    </header>

    <main class="dashboard">
        <section class="main-zone">
            <section class="panel">
                <div class="panel-title">
                    <span>Maquinas en operacion</span>
                    <span id="primaryCount">0 equipos</span>
                </div>
                <div class="primary-grid" id="primaryGrid"></div>
            </section>
        </section>

        <aside class="rail">
            <section class="panel stat-card">
                <div class="stat-title">Total de Maquinas</div>
                <div class="stat-value" id="totalMaquinas">0</div>

                <div class="split-stats">
                    <div class="split-box">
                        <span class="k">En curso</span>
                        <span class="v" id="countProduciendo">0</span>
                    </div>
                    <div class="split-box">
                        <span class="k">Activa</span>
                        <span class="v" id="countActiva">0</span>
                    </div>
                    <div class="split-box">
                        <span class="k">Sin hoja</span>
                        <span class="v" id="countSinHoja">0</span>
                    </div>
                </div>

                <div class="progress-wrap">
                    <div class="ring" id="prodRing"></div>
                    <div class="progress-text" id="prodText">0% en curso</div>
                </div>
            </section>

            <section class="panel stat-card">
                <div class="stat-title">Leyenda de Estado</div>
                <div class="legend" style="margin-top:8px;">
                    <div class="legend-item"><span class="dot" style="background:var(--ok);"></span> Produciendo</div>
                    <div class="legend-item"><span class="dot" style="background:var(--warn);"></span> Activa sin estacion</div>
                    <div class="legend-item"><span class="dot" style="background:var(--idle);"></span> Sin hoja activa</div>
                </div>
            </section>
        </aside>
    </main>

    <script>
        const MAP_REFRESH_MS = 6000;

        function safeText(value, fallback) {
            if (value === null || value === undefined || value === '') {
                return fallback;
            }
            return String(value);
        }

        function makeMetaRow(label, value) {
            const row = document.createElement('div');
            const b = document.createElement('b');
            b.textContent = label + ': ';
            row.appendChild(b);
            row.appendChild(document.createTextNode(safeText(value, 'N/A')));
            return row;
        }

        function buildMachineCard(machine) {
            const card = document.createElement('article');
            card.className = 'machine-card state-' + safeText(machine.estado_code, 'sin_hoja');

            const head = document.createElement('div');
            head.className = 'machine-head';

            const icon = document.createElement('div');
            icon.className = 'machine-icon';

            const titleWrap = document.createElement('div');
            titleWrap.style.minWidth = '0';

            const name = document.createElement('div');
            name.className = 'machine-name';
            name.textContent = safeText(machine.nombre, 'Maquina sin nombre');

            const badge = document.createElement('div');
            const code = safeText(machine.estado_code, 'sin_hoja');
            badge.className = 'machine-badge badge-' + code;
            badge.textContent = safeText(machine.estado_label, 'Sin hoja');

            titleWrap.appendChild(name);
            titleWrap.appendChild(badge);
            head.appendChild(icon);
            head.appendChild(titleWrap);

            const meta = document.createElement('div');
            meta.className = 'machine-meta';
            meta.appendChild(makeMetaRow('Pieza', machine.pieza));
            meta.appendChild(makeMetaRow('Hoja', machine.hoja_serie));
            meta.appendChild(makeMetaRow('Estacion', machine.estacion_actual || 'Sin produccion'));
            meta.appendChild(makeMetaRow('Tiempo', machine.tiempo_total));

            const link = document.createElement('a');
            link.className = 'machine-link';
            link.href = '/hojas_ruta/' + machine.id;
            link.textContent = 'Abrir detalle >';

            card.appendChild(head);
            card.appendChild(meta);
            card.appendChild(link);
            return card;
        }

        function renderMachineGroups(maquinas) {
            const primary = document.getElementById('primaryGrid');
            primary.innerHTML = '';

            const mainList = maquinas;

            if (!mainList.length) {
                const emptyMain = document.createElement('div');
                emptyMain.className = 'empty';
                emptyMain.textContent = 'No hay maquinas activas para mostrar.';
                primary.appendChild(emptyMain);
            } else {
                mainList.forEach(m => primary.appendChild(buildMachineCard(m)));
            }

            document.getElementById('primaryCount').textContent = mainList.length + ' equipos';
        }

        function renderStats(maquinas) {
            const total = maquinas.length;
            const produciendo = maquinas.filter(m => m.estado_code === 'produciendo').length;
            const activa = maquinas.filter(m => m.estado_code === 'activa').length;
            const sinHoja = maquinas.filter(m => m.estado_code === 'sin_hoja').length;

            document.getElementById('totalMaquinas').textContent = String(total);
            document.getElementById('countProduciendo').textContent = String(produciendo);
            document.getElementById('countActiva').textContent = String(activa);
            document.getElementById('countSinHoja').textContent = String(sinHoja);

            const pct = total ? Math.round((produciendo * 100) / total) : 0;
            const ring = document.getElementById('prodRing');
            ring.style.setProperty('--pct', String(pct));
            document.getElementById('prodText').textContent = pct + '% en curso';
        }

        async function loadMapa() {
            const info = document.getElementById('refreshInfo');
            try {
                const res = await fetch('/api/mapa_maquinas', { credentials: 'same-origin' });
                if (!res.ok) {
                    throw new Error('HTTP ' + res.status);
                }

                const data = await res.json();
                const maquinas = Array.isArray(data.maquinas) ? data.maquinas.filter(m => m.activo) : [];
                renderMachineGroups(maquinas);
                renderStats(maquinas);
                info.textContent = 'Actualizado ' + new Date().toLocaleTimeString();
            } catch (error) {
                console.error(error);
                info.textContent = 'Error al actualizar';
            }
        }

        loadMapa();
        setInterval(loadMapa, MAP_REFRESH_MS);
    </script>
</body>
</html>
