<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conciliacion CONTPAQi</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        .conciliacion-wrap {
            max-width: 1300px;
            margin: 24px auto;
            padding: 0 16px 24px;
        }

        .toolbar {
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 10px;
            align-items: center;
            margin-bottom: 14px;
        }

        .pager {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 8px 0 14px;
            flex-wrap: wrap;
        }

        .combo-row {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 10px;
            margin: 0 0 14px;
            align-items: center;
        }

        .combo-row select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cfd8dc;
            border-radius: 8px;
            font-size: 14px;
            background: #fff;
        }

        .toolbar input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cfd8dc;
            border-radius: 8px;
            font-size: 14px;
        }

        .status {
            font-size: 12px;
            color: #455a64;
            margin-bottom: 12px;
        }

        .summary-box {
            background: #f7fbff;
            border: 1px solid #d5e5f7;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 12px;
            font-size: 12px;
            color: #1d3b5a;
        }

        .summary-line {
            margin: 4px 0;
        }

        .upload-box {
            background: #f8fff8;
            border: 1px solid #d7ecd7;
            border-radius: 8px;
            margin: 0 0 14px;
            padding: 10px 12px;
        }

        .pedido-card {
            background: #fff;
            border: 1px solid #dce3e8;
            border-radius: 10px;
            margin-bottom: 14px;
            overflow: hidden;
        }

        .pedido-head {
            background: #eef6ff;
            padding: 12px;
            border-bottom: 1px solid #dce3e8;
            display: grid;
            grid-template-columns: repeat(4, minmax(120px, 1fr));
            gap: 8px;
            font-size: 13px;
        }

        .pedido-head div b {
            display: block;
            font-size: 11px;
            color: #607d8b;
            margin-bottom: 2px;
        }

        .section-title {
            font-size: 13px;
            color: #263238;
            font-weight: 700;
            margin: 10px 12px 4px;
        }

        table {
            width: calc(100% - 24px);
            margin: 0 12px 12px;
            border-collapse: collapse;
            font-size: 12px;
        }

        th, td {
            border: 1px solid #e0e0e0;
            padding: 6px;
            text-align: left;
        }

        thead th {
            background: #fafafa;
            color: #455a64;
            font-weight: 700;
        }

        .remision-block {
            border-top: 1px dashed #d0d7de;
            margin-top: 8px;
            padding-top: 8px;
        }

        .section-table {
            background: #fff;
            border: 1px solid #dce3e8;
            border-radius: 10px;
            padding: 10px 0;
            margin-bottom: 14px;
        }

        .muted {
            color: #78909c;
            font-size: 12px;
            margin: 10px 12px 12px;
        }

        @media (max-width: 980px) {
            .toolbar {
                grid-template-columns: 1fr;
            }

            .pedido-head {
                grid-template-columns: 1fr 1fr;
            }

            table {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <div class="conciliacion-wrap">
        <h2>Conciliacion CONTPAQi</h2>
        <p class="muted">Vista privada sin menu lateral. Filtros combinables tipo Excel para buscar por multiples campos.</p>

        <div class="toolbar" style="grid-template-columns: repeat(4, minmax(180px, 1fr));">
            <input id="q" type="text" placeholder="Busqueda global (varios terminos)">
            <input id="folio" type="text" placeholder="Folio pedido/remision">
            <input id="cliente" type="text" placeholder="Cliente">
            <input id="sucursal" type="text" placeholder="Sucursal">
            <input id="titulo" type="text" placeholder="Titulo o semana">
            <input id="fecha_desde" type="date" title="Fecha desde">
            <input id="fecha_hasta" type="date" title="Fecha hasta">
            <button class="btn btn-primary" id="btnBuscar">Aplicar filtros</button>
            <button class="btn btn-secondary" id="btnLimpiar">Limpiar</button>
            <button class="btn btn-secondary" id="btnSync">Sincronizar ahora</button>
        </div>

        <div class="upload-box">
            <div class="section-title" style="margin-top:0;">Indice principal de sucursales</div>
            <div class="muted">Puedes cargar Excel o CSV para no capturar partida por partida.</div>
            <div class="toolbar" style="grid-template-columns: 1fr auto auto auto; margin-bottom:0;">
                <input id="indiceFile" type="file" accept=".xlsx,.xls,.csv">
                <button class="btn btn-secondary" id="btnSubirIndice">Subir indice</button>
                <button class="btn btn-secondary" id="btnLimpiarIndice" style="background:#ffe9e6;border-color:#ffc9bf;color:#8a1f11;">Limpiar indice</button>
                <div id="indiceStatus" class="status" style="margin:0;"></div>
            </div>
        </div>

        <div id="resumen" class="summary-box" style="display:none;"></div>
        <div class="combo-row">
            <select id="semanaCombo"><option value="">Semana (todas)</option></select>
            <select id="sucursalCombo"><option value="">Sucursal (todas)</option></select>
            <button class="btn btn-secondary" id="btnToggleRemisiones" style="background:#e8f2ff;border-color:#bfd7ff;color:#0b4b9c;">Mostrar/Ocultar remisiones</button>
        </div>
        <div class="pager">
            <label for="limit" style="font-size:12px;color:#455a64;">Registros por pagina</label>
            <select id="limit" style="padding:6px 8px;border:1px solid #cfd8dc;border-radius:6px;">
                <option value="60">60</option>
                <option value="120" selected>120</option>
                <option value="240">240</option>
                <option value="500">500</option>
            </select>
            <button class="btn btn-secondary" id="btnPrev">Anterior</button>
            <button class="btn btn-secondary" id="btnNext">Siguiente</button>
            <span id="pageInfo" class="status" style="margin:0;"></span>
        </div>
        <div id="status" class="status">Cargando...</div>
        <div id="result"></div>
    </div>

    <script>
        function money(v) {
            const n = Number(v || 0);
            if (!Number.isFinite(n)) return '';
            return n.toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function fmtDate(v) {
            if (!v) return '';
            const d = new Date(v);
            if (Number.isNaN(d.getTime())) return String(v);
            return d.toLocaleDateString('es-MX');
        }

        function render(items, resumen) {
            const el = document.getElementById('result');
            const resumenEl = document.getElementById('resumen');

            if (resumen) {
                const semanas = (resumen.totales_por_semana || []).slice(0, 8)
                    .map(s => `${s.semana}: ${money(s.total)} (${s.pedidos} pedidos)`).join(' | ');
                resumenEl.style.display = 'block';
                resumenEl.innerHTML = `
                    <div class="summary-line"><b>Total pedidos:</b> ${resumen.total_pedidos || 0} | <b>Total partidas:</b> ${resumen.total_partidas || 0} | <b>Total remisiones:</b> ${resumen.total_remisiones || 0}</div>
                    <div class="summary-line"><b>Total importe pedidos:</b> ${money(resumen.total_importe || 0)} | <b>Faltantes desde indice:</b> ${resumen.total_faltantes_desde_indice || 0}</div>
                    <div class="summary-line"><b>Totales por semana:</b> ${semanas || 'Sin datos'}</div>
                `;
            } else {
                resumenEl.style.display = 'none';
                resumenEl.innerHTML = '';
            }

            if (!items || !items.length) {
                el.innerHTML = '<div class="muted">Sin resultados para esta consulta.</div>';
                return;
            }

            const pedidoRows = [];
            const remisionRows = [];

            for (const pedido of items) {
                for (const d of (pedido.detalles || [])) {
                    pedidoRows.push({
                        semana: pedido.periodo_semana || '',
                        fecha: d.fecha_documento || pedido.fecha_documento || '',
                        folio: d.folio || pedido.doc_folio || '',
                        serie: d.serie || pedido.serie || '',
                        sucursal: pedido.sucursal || '',
                        partida: d.line_number || '',
                        clave: d.clave_producto || '',
                        descripcion: d.descripcion || '',
                        cantidad: d.cantidad ?? '',
                        precio: d.precio_unitario,
                        total: d.total_partida,
                        inyectado: d.es_inyectado ? 'SI' : '',
                    });
                }

                for (const r of (pedido.remisiones || [])) {
                    for (const rd of (r.detalles || [])) {
                        remisionRows.push({
                            semana: pedido.periodo_semana || '',
                            folio_pedido: pedido.doc_folio || '',
                            folio_remision: r.doc_folio || '',
                            fecha: r.fecha_documento || '',
                            sucursal: r.sucursal || pedido.sucursal || '',
                            partida: rd.line_number || '',
                            clave: rd.clave_producto || '',
                            descripcion: rd.descripcion || '',
                            cantidad: rd.cantidad ?? '',
                            precio: rd.precio_unitario,
                            total: rd.total_partida,
                        });
                    }
                }
            }

            let pedidoRowsHtml = '';
            for (const r of pedidoRows) {
                pedidoRowsHtml += `
                    <tr>
                        <td>${r.semana}</td>
                        <td>${fmtDate(r.fecha)}</td>
                        <td>${r.folio}</td>
                        <td>${r.serie}</td>
                        <td>${r.sucursal}</td>
                        <td>${r.partida}</td>
                        <td>${r.clave}</td>
                        <td>${r.descripcion}</td>
                        <td>${r.cantidad}</td>
                        <td>${money(r.precio)}</td>
                        <td>${money(r.total)}</td>
                        <td>${r.inyectado}</td>
                    </tr>
                `;
            }

            let remRowsHtml = '';
            for (const r of remisionRows) {
                remRowsHtml += `
                    <tr>
                        <td>${r.semana}</td>
                        <td>${r.folio_pedido}</td>
                        <td>${r.folio_remision}</td>
                        <td>${fmtDate(r.fecha)}</td>
                        <td>${r.sucursal}</td>
                        <td>${r.partida}</td>
                        <td>${r.clave}</td>
                        <td>${r.descripcion}</td>
                        <td>${r.cantidad}</td>
                        <td>${money(r.precio)}</td>
                        <td>${money(r.total)}</td>
                    </tr>
                `;
            }

            el.innerHTML = `
                <div class="section-table">
                    <div class="section-title">Pedidos / Partidas (tabla superior)</div>
                    <table>
                        <thead>
                            <tr>
                                <th>Semana</th><th>Fecha</th><th>Folio</th><th>Serie</th><th>Sucursal</th><th>Partida</th><th>Clave</th><th>Descripcion</th><th>Cantidad</th><th>Precio Unitario</th><th>Total Partida</th><th>Inyectado</th>
                            </tr>
                        </thead>
                        <tbody>${pedidoRowsHtml || '<tr><td colspan="12">Sin partidas</td></tr>'}</tbody>
                    </table>
                </div>
                <div id="remisionesTableWrap" class="section-table" style="display:block;">
                    <div class="section-title">Remisiones (tabla inferior)</div>
                    <table>
                        <thead>
                            <tr>
                                <th>Semana</th><th>Folio Pedido</th><th>Folio Remision</th><th>Fecha</th><th>Sucursal</th><th>Partida</th><th>Clave</th><th>Descripcion</th><th>Cantidad</th><th>Precio Unitario</th><th>Total Partida</th>
                            </tr>
                        </thead>
                        <tbody>${remRowsHtml || '<tr><td colspan="11">Sin remisiones</td></tr>'}</tbody>
                    </table>
                </div>
            `;

            const semanas = [...new Set(pedidoRows.map(x => x.semana).filter(Boolean))].sort();
            const sucursales = [...new Set(pedidoRows.map(x => x.sucursal).filter(Boolean))].sort();
            const semCombo = document.getElementById('semanaCombo');
            const sucCombo = document.getElementById('sucursalCombo');
            const semVal = semCombo.value;
            const sucVal = sucCombo.value;
            semCombo.innerHTML = '<option value="">Semana (todas)</option>' + semanas.map(s => `<option value="${s}">${s}</option>`).join('');
            sucCombo.innerHTML = '<option value="">Sucursal (todas)</option>' + sucursales.map(s => `<option value="${s}">${s}</option>`).join('');
            semCombo.value = semanas.includes(semVal) ? semVal : '';
            sucCombo.value = sucursales.includes(sucVal) ? sucVal : '';
        }

        let currentPage = 1;
        let lastPage = 1;

        function updatePager(data) {
            currentPage = Number(data.page || 1);
            lastPage = Number(data.total_pages || 1) || 1;
            const totalRecords = Number(data.total_records || 0);

            document.getElementById('btnPrev').disabled = !data.has_prev;
            document.getElementById('btnNext').disabled = !data.has_next;
            document.getElementById('pageInfo').textContent = `Pagina ${currentPage} de ${lastPage} | Pedidos totales: ${totalRecords}`;
        }

        async function cargar(page = currentPage) {
            const status = document.getElementById('status');
            status.textContent = 'Consultando...';

            const params = new URLSearchParams();
            const campos = [
                'q', 'folio', 'cliente', 'sucursal', 'titulo',
                'fecha_desde', 'fecha_hasta'
            ];

            for (const campo of campos) {
                const val = (document.getElementById(campo)?.value || '').trim();
                if (val) params.set(campo, val);
            }

            const semanaComboVal = (document.getElementById('semanaCombo')?.value || '').trim();
            const sucursalComboVal = (document.getElementById('sucursalCombo')?.value || '').trim();
            if (semanaComboVal) params.set('titulo', semanaComboVal);
            if (sucursalComboVal) params.set('sucursal', sucursalComboVal);

            params.set('limit', (document.getElementById('limit')?.value || '120'));
            params.set('page', String(page));

            const resp = await fetch(`/api/contpaq/conciliacion?${params.toString()}`);
            const data = await resp.json();
            if (!resp.ok) {
                status.textContent = data.error || 'Error en consulta';
                return;
            }

            updatePager(data);
            render(data.items || [], data.resumen || null);
            status.textContent = `Mostrando ${data.total || 0} registro(s) en pagina ${currentPage}.`;
        }

        async function subirIndice() {
            const fileInput = document.getElementById('indiceFile');
            const status = document.getElementById('indiceStatus');
            if (!fileInput.files || !fileInput.files[0]) {
                status.textContent = 'Selecciona un archivo .xlsx, .xls o .csv';
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            status.textContent = 'Subiendo indice...';

            const resp = await fetch('/api/contpaq/indice/upload', {
                method: 'POST',
                body: formData,
            });
            const data = await resp.json();
            if (!resp.ok) {
                status.textContent = data.error || 'Error al subir indice';
                return;
            }

            status.textContent = `Indice cargado: ${data.imported || 0} fila(s)`;
            currentPage = 1;
            await cargar(1);
        }

        async function syncNow() {
            const status = document.getElementById('status');
            status.textContent = 'Sincronizando...';
            const resp = await fetch('/api/contpaq/sync', { method: 'POST' });
            const data = await resp.json();
            if (!resp.ok) {
                status.textContent = data.error || 'Error al sincronizar';
                return;
            }

            status.textContent = `Sincronizacion completa. Run #${data.run_id || ''}`;
            currentPage = 1;
            await cargar(1);
        }

        document.getElementById('btnBuscar').addEventListener('click', () => {
            currentPage = 1;
            cargar(1);
        });
        document.getElementById('btnSync').addEventListener('click', syncNow);
        document.getElementById('btnSubirIndice').addEventListener('click', subirIndice);
        document.getElementById('btnLimpiarIndice').addEventListener('click', async () => {
            const ok = window.confirm('Se borrara todo el indice cargado. Deseas continuar?');
            if (!ok) return;
            const status = document.getElementById('indiceStatus');
            status.textContent = 'Limpiando indice...';
            const resp = await fetch('/api/contpaq/indice/clear', { method: 'POST' });
            const data = await resp.json();
            if (!resp.ok) {
                status.textContent = data.error || 'Error al limpiar indice';
                return;
            }
            status.textContent = `Indice limpiado: ${data.deleted || 0} fila(s)`;
            currentPage = 1;
            cargar(1);
        });
        document.getElementById('btnToggleRemisiones').addEventListener('click', () => {
            const wrap = document.getElementById('remisionesTableWrap');
            if (!wrap) return;
            wrap.style.display = wrap.style.display === 'none' ? 'block' : 'none';
        });
        document.getElementById('semanaCombo').addEventListener('change', () => {
            currentPage = 1;
            cargar(1);
        });
        document.getElementById('sucursalCombo').addEventListener('change', () => {
            currentPage = 1;
            cargar(1);
        });
        document.getElementById('limit').addEventListener('change', () => {
            currentPage = 1;
            cargar(1);
        });
        document.getElementById('btnPrev').addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage -= 1;
                cargar(currentPage);
            }
        });
        document.getElementById('btnNext').addEventListener('click', () => {
            if (currentPage < lastPage) {
                currentPage += 1;
                cargar(currentPage);
            }
        });

        document.getElementById('btnLimpiar').addEventListener('click', () => {
            const campos = [
                'q', 'folio', 'cliente', 'sucursal', 'titulo',
                'fecha_desde', 'fecha_hasta'
            ];
            for (const campo of campos) {
                const el = document.getElementById(campo);
                if (el) el.value = '';
            }
            currentPage = 1;
            cargar(1);
        });

        for (const id of ['q', 'folio', 'cliente', 'sucursal', 'titulo']) {
            document.getElementById(id).addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    currentPage = 1;
                    cargar(1);
                }
            });
        }

        cargar(1);
    </script>
</body>
</html>
