<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conciliacion CONTPAQi</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        .conciliacion-wrap {
            max-width: 1300px;
            margin: 24px auto;
            padding: 0 16px 24px;
        }

        .toolbar {
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 10px;
            align-items: center;
            margin-bottom: 14px;
        }

        .toolbar input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cfd8dc;
            border-radius: 8px;
            font-size: 14px;
        }

        .status {
            font-size: 12px;
            color: #455a64;
            margin-bottom: 12px;
        }

        .summary-box {
            background: #f7fbff;
            border: 1px solid #d5e5f7;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 12px;
            font-size: 12px;
            color: #1d3b5a;
        }

        .summary-line {
            margin: 4px 0;
        }

        .faltantes-box {
            background: #fffaf5;
            border: 1px solid #ffe3c2;
            border-radius: 8px;
            margin: 0 0 14px;
            padding: 8px 10px;
        }

        .upload-box {
            background: #f8fff8;
            border: 1px solid #d7ecd7;
            border-radius: 8px;
            margin: 0 0 14px;
            padding: 10px 12px;
        }

        .pedido-card {
            background: #fff;
            border: 1px solid #dce3e8;
            border-radius: 10px;
            margin-bottom: 14px;
            overflow: hidden;
        }

        .pedido-head {
            background: #eef6ff;
            padding: 12px;
            border-bottom: 1px solid #dce3e8;
            display: grid;
            grid-template-columns: repeat(4, minmax(120px, 1fr));
            gap: 8px;
            font-size: 13px;
        }

        .pedido-head div b {
            display: block;
            font-size: 11px;
            color: #607d8b;
            margin-bottom: 2px;
        }

        .section-title {
            font-size: 13px;
            color: #263238;
            font-weight: 700;
            margin: 10px 12px 4px;
        }

        table {
            width: calc(100% - 24px);
            margin: 0 12px 12px;
            border-collapse: collapse;
            font-size: 12px;
        }

        th, td {
            border: 1px solid #e0e0e0;
            padding: 6px;
            text-align: left;
        }

        thead th {
            background: #fafafa;
            color: #455a64;
            font-weight: 700;
        }

        .remision-block {
            border-top: 1px dashed #d0d7de;
            margin-top: 8px;
            padding-top: 8px;
        }

        .muted {
            color: #78909c;
            font-size: 12px;
            margin: 10px 12px 12px;
        }

        @media (max-width: 980px) {
            .toolbar {
                grid-template-columns: 1fr;
            }

            .pedido-head {
                grid-template-columns: 1fr 1fr;
            }

            table {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <div class="conciliacion-wrap">
        <h2>Conciliacion CONTPAQi</h2>
        <p class="muted">Vista privada sin menu lateral. Filtros combinables tipo Excel para buscar por multiples campos.</p>

        <div class="toolbar" style="grid-template-columns: repeat(4, minmax(180px, 1fr));">
            <input id="q" type="text" placeholder="Busqueda global (varios terminos)">
            <input id="folio" type="text" placeholder="Folio pedido/remision">
            <input id="cliente" type="text" placeholder="Cliente">
            <input id="sucursal" type="text" placeholder="Sucursal">
            <input id="titulo" type="text" placeholder="Titulo o semana">
            <input id="fecha_desde" type="date" title="Fecha desde">
            <input id="fecha_hasta" type="date" title="Fecha hasta">
            <button class="btn btn-primary" id="btnBuscar">Aplicar filtros</button>
            <button class="btn btn-secondary" id="btnLimpiar">Limpiar</button>
            <button class="btn btn-secondary" id="btnSync">Sincronizar ahora</button>
        </div>

        <div class="upload-box">
            <div class="section-title" style="margin-top:0;">Indice principal de sucursales</div>
            <div class="muted">Puedes cargar Excel o CSV para no capturar partida por partida.</div>
            <div class="toolbar" style="grid-template-columns: 1fr auto auto; margin-bottom:0;">
                <input id="indiceFile" type="file" accept=".xlsx,.xls,.csv">
                <button class="btn btn-secondary" id="btnSubirIndice">Subir indice</button>
                <div id="indiceStatus" class="status" style="margin:0;"></div>
            </div>
        </div>

        <div id="resumen" class="summary-box" style="display:none;"></div>
        <div id="faltantes" class="faltantes-box" style="display:none;"></div>
        <div id="status" class="status">Cargando...</div>
        <div id="result"></div>
    </div>

    <script>
        function money(v) {
            const n = Number(v || 0);
            if (!Number.isFinite(n)) return '';
            return n.toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function fmtDate(v) {
            if (!v) return '';
            const d = new Date(v);
            if (Number.isNaN(d.getTime())) return String(v);
            return d.toLocaleDateString('es-MX');
        }

        function renderTablaDetalles(detalles) {
            if (!detalles || !detalles.length) {
                return '<div class="muted">Sin partidas.</div>';
            }

            let rows = '';
            for (const d of detalles) {
                rows += `
                    <tr>
                        <td>${d.line_number ?? ''}</td>
                        <td>${d.clave_producto || ''}</td>
                        <td>${d.descripcion || ''}</td>
                        <td>${d.cantidad ?? ''}</td>
                        <td>${money(d.precio_unitario)}</td>
                        <td>${money(d.total_partida)}</td>
                    </tr>
                `;
            }

            return `
                <table>
                    <thead>
                        <tr>
                            <th>Partida</th>
                            <th>Clave</th>
                            <th>Descripcion</th>
                            <th>Cantidad</th>
                            <th>Precio Unitario</th>
                            <th>Total Partida</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            `;
        }

        function render(items, resumen, faltantes) {
            const el = document.getElementById('result');
            const resumenEl = document.getElementById('resumen');
            const faltantesEl = document.getElementById('faltantes');

            if (resumen) {
                const semanas = (resumen.totales_por_semana || []).slice(0, 8)
                    .map(s => `${s.semana}: ${money(s.total)} (${s.pedidos} pedidos)`).join(' | ');
                resumenEl.style.display = 'block';
                resumenEl.innerHTML = `
                    <div class="summary-line"><b>Total pedidos:</b> ${resumen.total_pedidos || 0} | <b>Total partidas:</b> ${resumen.total_partidas || 0} | <b>Total remisiones:</b> ${resumen.total_remisiones || 0}</div>
                    <div class="summary-line"><b>Total importe pedidos:</b> ${money(resumen.total_importe || 0)} | <b>Faltantes desde D:</b> ${resumen.total_faltantes_desde_d || 0} | <b>Faltantes desde indice:</b> ${resumen.total_faltantes_desde_indice || 0}</div>
                    <div class="summary-line"><b>Totales por semana:</b> ${semanas || 'Sin datos'}</div>
                `;
            } else {
                resumenEl.style.display = 'none';
                resumenEl.innerHTML = '';
            }

            if (faltantes && faltantes.length) {
                let rows = '';
                for (const f of faltantes) {
                    rows += `
                        <tr>
                            <td>${f.semana || ''}</td>
                            <td>${f.sucursal || ''}</td>
                            <td>${f.folio || ''}</td>
                            <td>${f.clave_producto || ''}</td>
                            <td>${f.descripcion || ''}</td>
                            <td>${f.cantidad ?? ''}</td>
                        </tr>
                    `;
                }
                faltantesEl.style.display = 'block';
                faltantesEl.innerHTML = `
                    <div class="section-title" style="margin-top:2px;">Faltantes detectados (comparando partidas D contra P)</div>
                    <table>
                        <thead>
                            <tr>
                                <th>Semana</th>
                                <th>Sucursal</th>
                                <th>Folio D</th>
                                <th>Clave</th>
                                <th>Descripcion</th>
                                <th>Cantidad</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                `;
            } else {
                faltantesEl.style.display = 'none';
                faltantesEl.innerHTML = '';
            }

            if (!items || !items.length) {
                el.innerHTML = '<div class="muted">Sin resultados para esta consulta.</div>';
                return;
            }

            let html = '';
            for (const pedido of items) {
                let remisionesHtml = '';
                if (pedido.remisiones && pedido.remisiones.length) {
                    for (const rem of pedido.remisiones) {
                        remisionesHtml += `
                            <div class="remision-block">
                                <div class="muted"><b>Remision:</b> ${rem.doc_folio || ''} | <b>Sucursal:</b> ${rem.sucursal || ''} | <b>Fecha:</b> ${fmtDate(rem.fecha_documento)}</div>
                                ${renderTablaDetalles(rem.detalles || [])}
                            </div>
                        `;
                    }
                } else {
                    remisionesHtml = '<div class="muted">Este pedido no tiene remisiones relacionadas.</div>';
                }

                html += `
                    <div class="pedido-card">
                        <div class="pedido-head">
                            <div><b>Pedido</b>${pedido.doc_folio || ''}</div>
                            <div><b>Cliente</b>${pedido.cliente || ''}</div>
                            <div><b>Sucursal</b>${pedido.sucursal || ''}</div>
                            <div><b>Titulo/Semana</b>${pedido.titulo || pedido.periodo_semana || ''}</div>
                        </div>
                        <div class="section-title">Partidas del pedido</div>
                        ${renderTablaDetalles(pedido.detalles || [])}
                        <div class="section-title">Remisiones relacionadas</div>
                        ${remisionesHtml}
                    </div>
                `;
            }
            el.innerHTML = html;
        }

        async function cargar() {
            const status = document.getElementById('status');
            status.textContent = 'Consultando...';

            const params = new URLSearchParams();
            const campos = [
                'q', 'folio', 'cliente', 'sucursal', 'titulo',
                'fecha_desde', 'fecha_hasta'
            ];

            for (const campo of campos) {
                const val = (document.getElementById(campo)?.value || '').trim();
                if (val) params.set(campo, val);
            }

            params.set('limit', '60');

            const resp = await fetch(`/api/contpaq/conciliacion?${params.toString()}`);
            const data = await resp.json();
            if (!resp.ok) {
                status.textContent = data.error || 'Error en consulta';
                return;
            }

            const faltantes = [...(data.faltantes_desde_indice || []), ...(data.faltantes_desde_d || [])];
            render(data.items || [], data.resumen || null, faltantes);
            status.textContent = `Mostrando ${data.total || 0} pedido(s).`;
        }

        async function subirIndice() {
            const fileInput = document.getElementById('indiceFile');
            const status = document.getElementById('indiceStatus');
            if (!fileInput.files || !fileInput.files[0]) {
                status.textContent = 'Selecciona un archivo .xlsx, .xls o .csv';
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            status.textContent = 'Subiendo indice...';

            const resp = await fetch('/api/contpaq/indice/upload', {
                method: 'POST',
                body: formData,
            });
            const data = await resp.json();
            if (!resp.ok) {
                status.textContent = data.error || 'Error al subir indice';
                return;
            }

            status.textContent = `Indice cargado: ${data.imported || 0} fila(s)`;
            await cargar();
        }

        async function syncNow() {
            const status = document.getElementById('status');
            status.textContent = 'Sincronizando...';
            const resp = await fetch('/api/contpaq/sync', { method: 'POST' });
            const data = await resp.json();
            if (!resp.ok) {
                status.textContent = data.error || 'Error al sincronizar';
                return;
            }

            status.textContent = `Sincronizacion completa. Run #${data.run_id || ''}`;
            await cargar();
        }

        document.getElementById('btnBuscar').addEventListener('click', cargar);
        document.getElementById('btnSync').addEventListener('click', syncNow);
        document.getElementById('btnSubirIndice').addEventListener('click', subirIndice);

        document.getElementById('btnLimpiar').addEventListener('click', () => {
            const campos = [
                'q', 'folio', 'cliente', 'sucursal', 'titulo',
                'fecha_desde', 'fecha_hasta'
            ];
            for (const campo of campos) {
                const el = document.getElementById(campo);
                if (el) el.value = '';
            }
            cargar();
        });

        for (const id of ['q', 'folio', 'cliente', 'sucursal', 'titulo']) {
            document.getElementById(id).addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    cargar();
                }
            });
        }

        cargar();
    </script>
</body>
</html>
