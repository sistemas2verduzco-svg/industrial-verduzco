services:
  db:
    image: postgres:15
    container_name: catalogo_db
    environment:
      POSTGRES_USER: catalogo_user
      POSTGRES_PASSWORD: catalogo_pass
      POSTGRES_DB: catalogo_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - catalogo_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U catalogo_user -d catalogo_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build: .
    container_name: catalogo_app
    ports:
        - "5000:5000"
    networks:
      - catalogo_network
    env_file:
      - .env
    environment:
      FLASK_APP: app.py
      FLASK_ENV: production
      TEMPLATES_AUTO_RELOAD: "1"
      DATABASE_URL: postgresql://catalogo_user:catalogo_pass@db:5432/catalogo_db
    volumes:
      - .:/app
    restart: unless-stopped
    command: gunicorn -w 2 -b 0.0.0.0:5000 app:app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('127.0.0.1', 5000), 2); s.close()\""]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  nginx:
    image: nginx:stable-alpine
    container_name: catalogo_nginx
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/app/static:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    networks:
      - catalogo_network
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    container_name: catalogo_certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    networks:
      - catalogo_network
    entrypoint: /bin/sh

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: catalogo_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
      PGADMIN_CONFIG_COOKIE_DEFAULT: 86400
      PGADMIN_CONFIG_CONSOLE_LOG_LEVEL: 10
      SCRIPT_NAME: /pgadmin4
    ports:
      - "5050:80"
    networks:
      - catalogo_network
    restart: unless-stopped
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  adminer:
    image: adminer:4
    container_name: catalogo_adminer
    restart: unless-stopped
    depends_on:
      - db
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8080:8080"
    networks:
      - catalogo_network

  # MySQL Empaque360 (sistema de pesos) — convive con Postgres de Control Calidad 360
  empaque_db:
    image: mysql:8.0
    container_name: empaque_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: empaqueops
      MYSQL_USER: empaque_app
      MYSQL_PASSWORD: ${EMPAQUE_MYSQL_PASSWORD:-Empaque360*App2024}
      MYSQL_ROOT_PASSWORD: ${EMPAQUE_MYSQL_ROOT_PASSWORD:-Empaque360*Root2024}
    ports:
      # Misma 3307 que en planta, para no romper connection strings de apps
      - "3307:3306"
    volumes:
      - empaque_mysql_data:/var/lib/mysql
    networks:
      - catalogo_network
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=200
      # Igual que Windows: SalesOrders == salesorders (requerido por Empaque360)
      - --lower-case-table-names=1
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pEmpaque360*Root2024"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  postgres_data:
  pgadmin_data:
  empaque_mysql_data:

networks:
  catalogo_network:
    driver: bridge
