server {
    listen 80;
    server_name controlcalidad360.site www.controlcalidad360.site;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name controlcalidad360.site www.controlcalidad360.site;
    client_max_body_size 50M;

    ssl_certificate /etc/letsencrypt/live/controlcalidad360.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/controlcalidad360.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /static/ {
        alias /app/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /;

        proxy_pass http://app:5000;
        proxy_read_timeout 90;
        proxy_connect_timeout 90;
    }

    location /healthz {
        proxy_pass http://app:5000/;
    }
}
